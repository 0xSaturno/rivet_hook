name: Build

on:
  push:
    branches: [ stable ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish rivet_hook-release-vs as a pre-release'
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        buildenv: [vs, mingw]
        buildtype: [debug, release]
        hook_name: [rivet_hook, rivet_loader]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Meson
        run: pip install meson ninja

      - name: Install NASM
        run: choco install nasm

      - name: Setup MSBuild
        if: matrix.buildenv == 'vs'
        uses: microsoft/setup-msbuild@v3

      # NOTE: build type release has a deadlock when the hook gets unloaded
      # need to figure out why.
      - name: Configure Hook (MSVC)
        if: matrix.buildenv == 'vs'
        run: meson setup build . --buildtype ${{ matrix.buildtype }} --debug --vsenv -Dloader_only=${{ matrix.hook_name == 'rivet_loader' }}

      - name: Configure Hook (MinGW)
        if: matrix.buildenv == 'mingw'
        run: meson setup build . --buildtype ${{ matrix.buildtype }} --debug -Dloader_only=${{ matrix.hook_name == 'rivet_loader' }}

      - name: Compile Hook
        run: meson compile -C build -j 0

      - name: Move Files
        run: |
          mkdir -p build/rivet_hook
          mv build/rivet_hook.dll build/rivet_hook/
          mv build/subprojects/hid_hook/hid.dll build/rivet_hook/
          mv build/subprojects/hid_hook/hid_win10.dll build/rivet_hook/

      - name: Move Debug Files
        if: matrix.buildenv == 'vs'
        run: |
          mv build/rivet_hook.pdb build/rivet_hook/
          mv build/subprojects/hid_hook/hid.pdb build/rivet_hook/
          mv build/subprojects/hid_hook/hid_win10.pdb build/rivet_hook/

      - uses: actions/upload-artifact@v7
        with:
          name: '${{ matrix.hook_name}}-${{ matrix.buildtype }}-${{ matrix.buildenv }}'
          path: 'build/rivet_hook'

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: rivet_hook-release-vs
          path: rivet_hook

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="saturn-$(date -u +%F)-${GITHUB_SHA::7}"
          zip -r "rivet_hook-$TAG.zip" rivet_hook
          gh release create "$TAG" "rivet_hook-$TAG.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Fork build $TAG" --generate-notes
